#
# Not secret
#

# the music player plays these files instead of the YouTube playlist
# (mode = "replace", the default) or shuffled together with it
# (mode = "both"); the first song of the YouTube playlist is always the intro
[music]
folder = "/home/necauqua/music/old-phone"
folder-label = "from old phone backup"
mode = "both"

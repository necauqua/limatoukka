[package]
name = "limatoukka"
version = "0.1.0"
edition = "2024"

default-run = "limatoukka"

[dependencies]
limatoukka-macros = { path = "macros" }
noita-engine-reader = { path = "../noita/noita-utility-box/noita-engine-reader" }
neca-cmd = "0.4.0"

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15.26", default-features = false, features = ["toml"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "local-time",
] }
twitch-irc = { version = "6.1.2", features = [
    "metrics-collection",
    "with-serde",
] }
uuid = { version = "1.26.1", features = ["v7"] }
inventory = "0.3.24"
thiserror = "2.0.21"
rustis = "0.26.0"

pipe-channel = "1.3.0"
libc = "0.2.189"
reedline = "0.52.0"
axum = { version = "0.8.9", features = ["tracing"] }
maud = { version = "0.27.0", features = ["axum"] }
futures-util = "0.3.34"
futures = "0.3.34"
indexmap = "2.14.2"
serde_yml = "0.0.13"
humantime-serde = "1.1.1"
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
lazy-regex = "3.6.1"
bitflags = "2.13.2"
# unreleased upstream main for the hype train V2 eventsub types (not in 0.8.0);
# change back to a crates.io version when a release has them
twitch_api = { git = "https://github.com/twitch-rs/twitch_api", rev = "62e4c626644496bd619f7b58565e5d1cd8e243aa", features = ["client", "eventsub", "helix", "mock_api", "reqwest", "twitch_oauth2", "typed-builder"] }
reqwest = { version = "0.13", features = ["json", "query"] }
keyring = { version = "3.6.3", features = [
    "crypto-rust",
    "sync-secret-service",
] }
async-trait = "0.1.92"
elasticsearch = "9.1.0-alpha.1"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls", "url"] }
paste = "1.0.15"
sysinfo = "0.39.6"
rand = "0.10.3"
compact_str = "0.9.1"
dashmap = "6.2.1"
tracing-chrome = "0.7.2"
parse_duration = "2.1.1"
jiff = "0.2.37"

[dev-dependencies]
insta = "1.48.0"
reqwest-sse = "0.2.0"

[patch.crates-io]
# the same twitch_types as the one of the twitch_api git dependency above
twitch_types = { git = "https://github.com/twitch-rs/twitch_api", rev = "62e4c626644496bd619f7b58565e5d1cd8e243aa" }

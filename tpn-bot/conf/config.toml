# "$schema" = "../target/config-schema.json"

env = "prod"
target = "necauqua"

display = ":17"

valkey = "redis://localhost:6379"
loki = "http://localhost:3030"
otel = "http://localhost:4318/v1/traces"

browser-source-bind = "localhost:7456"

first-time-kick = "1h"

vote-min-ratio = 0.7
vote-trigger-people = 5

[kick-votes]
trigger-interval = "30s"
vote-time = "1m"

[restart-votes]
trigger-interval = "30s"
vote-time = "1m"

[reset-votes]
trigger-interval = "30s"
vote-time = "2m"

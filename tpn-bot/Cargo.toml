[package]
name = "tpn-bot"
version = "0.1.0"
edition = "2024"

default-run = "tpn-bot"

[dependencies]
tpn-bot-macros = { path = "macros" }
neca-cmd = { path = "neca-cmd" }
noita-engine-reader = { path = "../../noita-utility-box/noita-engine-reader" }

anyhow = "1.0.97"
clap = { version = "4.5.31", features = ["derive"] }
config = { version = "0.15.9", default-features = false, features = ["toml"] }
metrics = "0.24.1"
schemars = "0.8.22"
serde = { version = "1.0.218", features = ["derive"] }
tokio = { version = "1.43.0", features = ["full", "tracing"] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-loki = "0.2.6"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
twitch-irc = { version = "5.0.1", features = [
    "metrics-collection",
    "with-serde",
] }
uuid = { version = "1.15.1", features = ["v7"] }
inventory = "0.3.20"
thiserror = "2.0.12"
rustis = "0.13.3"
libxdo = "0.6.0"
opentelemetry = "0.28.0"
opentelemetry_sdk = "0.28.0"
tracing-opentelemetry = "0.29.0"
opentelemetry-otlp = "0.28.0"
tokio-metrics = "0.4.0"
tiny-xlib = "0.2.4"
pipe-channel = "1.3.0"
libc = "0.2.171"
reedline = "0.38.0"
axum = { version = "0.8.1", features = ["tracing"] }
maud = { version = "0.27.0", features = ["axum"] }
futures-util = "0.3.31"
futures = "0.3.31"
indexmap = "2.8.0"
serde_yml = "0.0.12"
humantime-serde = "1.1.1"
serde_json = "1.0.140"
strum = { version = "0.27.1", features = ["derive"] }
lazy-regex = "3.4.1"
bitflags = "2.9.0"
twitch_api = { version = "0.7.2", features = [
    "client",
    "eventsub",
    "helix",
    "reqwest",
    "twitch_oauth2",
] }
reqwest = "0.12.15"
keyring = { version = "3.6.2", features = [
    "crypto-rust",
    "sync-secret-service",
] }
async-trait = "0.1.88"

[build-dependencies]
anyhow = "1.0.97"
schemars = "0.8.22"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
insta = "1.42.2"

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>YouTube Queue Player</title>
        <style>
            * {
                color: #d4d4d4;
                background-color: #1e1e1e;
                font-family:
                    JetBrains Mono,
                    monospace;
            }
            input[type="range"] {
                appearance: none;
                width: 100%;
                height: 8px;
                border-radius: 4px;
                background: #444;
                outline: none;
            }
            iframe {
                display: none;
            }
        </style>
    </head>

    <body>
        <div id="player"></div>

        <div
            style="
                display: flex;
                flex-direction: column;
                gap: 1rem;
                max-width: 60rem;
                margin: auto;
            "
        >
            <h4>YouTube Queue Player</h4>

            <span id="currentTitle"></span>

            <div style="display: flex; gap: 0.5rem; align-items: center">
                <button
                    onclick="reset().catch(console.error)"
                    style="align-self: normal"
                >
                    ↺
                </button>
                <button
                    onclick="playPrev().catch(console.error)"
                    style="align-self: normal"
                >
                    &lt;&lt;
                </button>
                <button
                    id="pause"
                    onclick="togglePause()"
                    style="align-self: normal; width: 2rem; height: 2rem"
                >
                    ▶︎
                </button>
                <button
                    onclick="playNext().catch(console.error)"
                    style="align-self: normal"
                >
                    &gt;&gt;
                </button>
                <input
                    id="seek"
                    type="range"
                    min="0"
                    max="1000"
                    value="0"
                    oninput="updateSeek()"
                />
            </div>

            <div style="display: flex; gap: 0.5rem; align-items: center">
                <span
                    id="volumeDisplay"
                    style="min-width: 5rem; white-space: nowrap"
                ></span>
                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="100"
                    oninput="volumeInput()"
                    onchange="volumeChange()"
                />
                <label style="white-space: nowrap">
                    <input id="localVolume" type="checkbox" />
                    local volume
                </label>
            </div>
        </div>

        <script>
            let player;

            // the server has the true values, these are only copies
            let globalVolume = 15;
            // volume for the current song only, null for the global volume
            let songVolume = null;

            // show the volume and give it to the player; the slider shows
            // the volume that plays now
            function applyVolume() {
                const effective = songVolume ?? globalVolume;
                volume.value = effective;
                volumeDisplay.innerText =
                    songVolume === null
                        ? globalVolume
                        : globalVolume + " (" + songVolume + ")";
                player?.setVolume(effective);
            }

            // while the slider is dragged
            function volumeInput() {
                const value = parseInt(volume.value);
                if (localVolume.checked) {
                    songVolume = value;
                } else {
                    globalVolume = value;
                    songVolume = null;
                }
                applyVolume();
            }

            // when the slider is released
            function volumeChange() {
                volumeInput();
                if (localVolume.checked) {
                    localVolume.checked = false;
                    fetch("/state/song-volume/" + songVolume, {
                        method: "POST",
                    }).catch(console.error);
                } else {
                    fetch("/state/volume/" + globalVolume, {
                        method: "POST",
                    }).catch(console.error);
                }
            }

            function showTitle(current) {
                if (!current) {
                    currentTitle.textContent = "";
                    return;
                }
                const [{ title, author }, source] = current;
                currentTitle.textContent = title + " - " + author;
                if (source) {
                    currentTitle.textContent +=
                        " (requested by " + source.requester + ")";
                }
            }

            // the video in the player, its position and duration, to resume
            // after a reload of the page
            let currentVideoId = null;
            // a cued video has no duration in the player until it plays
            let currentDuration = 0;

            function duration() {
                const fromPlayer = player?.getDuration?.() ?? 0;
                if (fromPlayer > 0) {
                    currentDuration = fromPlayer;
                }
                return currentDuration;
            }

            function showPosition(time) {
                const total = duration();
                seek.value =
                    total > 0 ? Math.min(1000, (time * 1000) / total) : 0;
            }

            function savePosition() {
                if (currentVideoId && player?.getCurrentTime) {
                    localStorage.setItem(
                        "position",
                        JSON.stringify({
                            videoId: currentVideoId,
                            time: player.getCurrentTime(),
                            duration: duration(),
                        }),
                    );
                }
            }

            function savedPosition(videoId) {
                try {
                    const saved = JSON.parse(localStorage.getItem("position"));
                    if (saved?.videoId === videoId) {
                        return {
                            time: saved.time,
                            duration: saved.duration ?? 0,
                        };
                    }
                } catch {}
                return { time: 0, duration: 0 };
            }

            let resolvePlayerReady;
            const playerReady = new Promise((r) => (resolvePlayerReady = r));

            // load the current song from the server, at the saved position
            async function resume(current, paused) {
                await playerReady;
                if (!current || currentVideoId) {
                    return;
                }
                const [{ videoId, length }] = current;
                currentVideoId = videoId;
                const saved = savedPosition(videoId);
                // songs from a playlist have no length
                currentDuration =
                    saved.duration > 0 ? saved.duration : (length?.secs ?? 0);
                showPosition(saved.time);
                const options = { videoId, startSeconds: saved.time };
                if (paused) {
                    player.cueVideoById(options);
                } else {
                    player.loadVideoById(options);
                }
            }

            let firstLoad = true;

            async function loadState() {
                const res = await fetch("/state");
                const { current, paused, volume } = await res.json();
                globalVolume = volume.global;
                songVolume = volume.song;
                applyVolume();
                showTitle(current);
                if (firstLoad) {
                    firstLoad = false;
                    await resume(current, paused);
                }
            }

            function setPaused(paused) {
                pause.innerText = paused ? "▶︎" : "⏸︎";
                fetch("/state/paused/" + paused, { method: "POST" }).catch(
                    console.error,
                );
            }

            // only playing and paused change the state on the server;
            // unstarted, buffering and ended happen on each song change
            function updatePause(state) {
                switch (state) {
                    case YT.PlayerState.PLAYING:
                        setPaused(false);
                        break;
                    case YT.PlayerState.PAUSED:
                        savePosition();
                        setPaused(true);
                        break;
                    case YT.PlayerState.CUED:
                        pause.innerText = "▶︎";
                        break;
                }
            }

            function updateSeek() {
                player?.seekTo((seek.value * duration()) / 1000, true);
            }

            let seekUpdater = null;

            // called by the yt iframe api
            function onYouTubeIframeAPIReady() {
                player = new YT.Player("player", {
                    height: "390",
                    width: "640",
                    events: {
                        onReady() {
                            applyVolume();
                            resolvePlayerReady();
                        },
                        onStateChange(e) {
                            updatePause(e.data);
                            applyVolume();

                            if (e.data == YT.PlayerState.ENDED) {
                                playNext().catch(console.error);
                            }

                            if (e.data == YT.PlayerState.PLAYING) {
                                seekUpdater = setInterval(() => {
                                    showPosition(player.getCurrentTime());
                                    savePosition();
                                }, 200);
                            } else if (seekUpdater) {
                                clearInterval(seekUpdater);
                                seekUpdater = null;
                            }
                        },
                    },
                });
            }

            async function play(endpoint) {
                const res = await fetch(endpoint, { method: "POST" }).then(
                    (res) => res.json(),
                );
                if (seekUpdater) {
                    clearInterval(seekUpdater);
                    seekUpdater = null;
                }
                seek.value = 0;
                // the server removes the song volume on /next and /prev
                songVolume = null;
                applyVolume();
                showTitle(res);
                if (res) {
                    const [{ videoId, length }] = res;
                    currentVideoId = videoId;
                    currentDuration = length?.secs ?? 0;
                    player.loadVideoById(videoId);
                }
            }

            function togglePause() {
                if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            }

            async function playPrev() {
                await play("/prev");
            }

            async function playNext() {
                await play("/next");
            }

            async function reset() {
                await fetch("/reset", { method: "POST" });
            }

            const events = new EventSource("/events");
            // also after a reconnect, to get the changes that were missed
            events.addEventListener("open", () =>
                loadState().catch(console.error),
            );
            // the server already stored the values of these two events
            events.addEventListener("volume", (e) => {
                globalVolume = parseInt(e.data);
                songVolume = null;
                applyVolume();
            });
            events.addEventListener("song-volume", (e) => {
                songVolume = parseInt(e.data);
                applyVolume();
            });
            events.addEventListener("next", () =>
                playNext().catch(console.error),
            );
            events.addEventListener("prev", () =>
                playPrev().catch(console.error),
            );
            events.addEventListener("pause", () => player.pauseVideo());
            events.addEventListener("play", () => player.playVideo());
        </script>
        <!-- after the script above, which defines onYouTubeIframeAPIReady:
             the API can call it as soon as it loads (e.g. from the cache) -->
        <script src="https://www.youtube.com/iframe_api"></script>
    </body>
</html>

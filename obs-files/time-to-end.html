<div>
  ends soon
</div>

<script>
  const deadline = new Date('2025-06-14T16:00:00').getTime();

  let interval;

  const update = () => {
    let diff = deadline - new Date().getTime();
    let secs = Math.floor(diff / 1000);
    let mins = Math.floor(secs / 60);
    let hrs = Math.floor(mins / 60);
    let days = Math.floor(hrs / 24);
    secs = (secs % 60).toString().padStart(2, '0');
    mins = (mins % 60).toString().padStart(2, '0');
    hrs = (hrs % 24).toString().padStart(2, '0');
    days = days != 0 ? `${days}:` : '';

    document.body.innerText = `ends in ${days}${hrs}:${mins}:${secs}`;
  };
  update();

  setInterval(update, 1000);
</script>
